<!doctype html>
<html data-theme="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta
      content="Dean Grant — Software Engineer & Writer. Building open-source tools and writing about tech, design, and code."
      name="description"
    />
    <title>Dean Grant</title>
    <!-- Key must match THEME_STORAGE_KEY in src/constants/theme.constants.ts -->
    <script>
      try {
        const theme = localStorage.getItem("portfolio-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
